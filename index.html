<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savore — Menu</title>
<style>
:root{--bg:#f5f3ef;--ink:#3c3c3c;--mute:#8a867f;--line:#d9d5ce;--accent:#7f0019;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1c;--ink:#e9e6e0;--mute:#9b968d;--line:#3a3834;--accent:#d6869a}}
:root[data-theme="dark"]{--bg:#1f1e1c;--ink:#e9e6e0;--mute:#9b968d;--line:#3a3834;--accent:#d6869a}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,"Noto Sans",sans-serif;font-weight:300;line-height:1.8;letter-spacing:.04em;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:720px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{font-size:15px;letter-spacing:.3em;text-transform:uppercase;font-weight:400;color:var(--ink);text-decoration:none}
nav{display:flex;gap:22px}
nav a{font-size:12px;color:var(--mute);text-decoration:none;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid transparent;padding:4px 0}
nav a:hover{color:var(--ink);border-color:var(--accent)}
.hero{padding:64px 0 0;text-align:center}
.hero h1{font-weight:300;font-size:clamp(28px,6vw,40px);letter-spacing:.35em;margin:0 0 12px;text-transform:uppercase;animation:in 1s ease both}
.hero p{margin:0;color:var(--mute);font-size:13px;letter-spacing:.25em;animation:in 1s .15s ease both}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin:26px auto 40px}
@keyframes in{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.marquee{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:8;overflow:hidden;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 0 10px;margin-bottom:24px}
.track{display:flex;width:max-content;animation:slide 40s linear infinite;will-change:transform}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tile{width:130px;flex:none;margin-right:18px}
.tile img{display:block;width:130px;height:100px;object-fit:contain}
.tile span{display:block;margin-top:6px;font-size:9px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
main{max-width:720px;margin:0 auto;padding:0 24px 80px}
section{padding:48px 0 8px}
h2{font-size:12px;font-weight:400;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.item{display:grid;grid-template-columns:96px 1fr auto;gap:4px 22px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.item:first-of-type{border-top:1px solid var(--line)}
.item img{width:96px;height:96px;object-fit:contain;grid-row:1/3}
.item h3{margin:0;font-size:16px;font-weight:400;letter-spacing:.08em;align-self:end}
.item p{grid-column:2;margin:0;color:var(--mute);font-size:13px;max-width:46ch;align-self:start}
.price{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums;align-self:end;text-align:right}
.price small{display:block;color:var(--mute);font-size:11px;letter-spacing:.1em}
.rv{opacity:0;transform:translateX(70px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
footer{max-width:720px;margin:0 auto;padding:40px 24px 64px;text-align:center;color:var(--mute);font-size:11px;letter-spacing:.25em;border-top:1px solid var(--line)}
@media (max-width:520px){nav{gap:14px}.logo{letter-spacing:.2em;font-size:13px}.tile,.tile img{width:110px}.tile img{height:86px}.item{grid-template-columns:76px 1fr;gap:2px 16px}.item img{width:76px;height:76px;grid-row:1/4}.price{grid-column:2;text-align:left;align-self:start}.price small{display:inline;margin-left:6px}.item p{grid-column:2}}
@media (prefers-reduced-motion:reduce){.track{animation-duration:90s}.rv{opacity:1;transform:none;transition:none}.hero h1,.hero p{animation:none}}

.add{display:block;margin:8px 0 0 auto;font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:none;border:1px solid var(--ink);padding:3px 14px;cursor:pointer}
.add:hover{background:var(--ink);color:var(--bg)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--bg);border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:center;gap:16px;transform:translateX(100%);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
#bar.on{display:flex;transform:none}
#bar span{font-size:13px;letter-spacing:.12em}
.btn{font:inherit;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--bg);background:var(--ink);border:1px solid var(--ink);padding:9px 20px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:none}
#sheet.on{display:block}
#panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:pin .5s cubic-bezier(.2,.7,.2,1)}
@keyframes pin{from{transform:translateX(100%)}to{transform:none}}
#panel h4{margin:0 0 6px;font-size:12px;font-weight:400;letter-spacing:.35em;text-transform:uppercase;color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.step{display:flex;align-items:center;gap:10px;font-size:13px}
.step button{width:26px;height:26px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer}
.tot{display:flex;justify-content:space-between;padding:18px 0;font-size:16px}
.x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer}
.qr{width:min(300px,100%);margin:14px auto;display:flex;justify-content:center}
.qr img{width:100%;height:auto;display:block}
#panel input{width:100%;font:inherit;font-size:14px;padding:10px 0;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--ink);outline:0;margin:8px 0 18px}
.note{color:var(--mute);font-size:12px;line-height:1.7}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
main{padding-bottom:110px}
@media (prefers-reduced-motion:reduce){#bar,#panel{transition:none;animation:none}}
.trk{list-style:none;margin:0 0 10px;padding:0}.trk li{display:flex;align-items:center;gap:14px;padding:10px 0;color:var(--mute);font-size:14px}.trk i{width:12px;height:12px;border:1px solid var(--mute);border-radius:50%;flex:none}.trk li.d{color:var(--ink)}.trk li.d i{background:var(--ink);border-color:var(--ink)}.trk li.a{color:var(--accent)}.trk li.a i{background:var(--accent);border-color:var(--accent);animation:pl 1.4s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}
.pr{display:block;max-width:100%;max-height:240px;margin:10px 0;border:1px solid var(--line)}
.sm{font-size:11px;padding:6px 12px}.stf{color:var(--mute);font-size:10px;letter-spacing:.2em;text-decoration:none}
@media (prefers-reduced-motion:reduce){.trk li.a i{animation:none}}
.sl{position:relative;height:48px;border:1px solid var(--ink);border-radius:24px;margin:14px 0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;text-align:center;line-height:46px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}.sk{position:absolute;left:3px;top:3px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);line-height:38px;font-size:20px;cursor:grab}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:420px;margin:0 auto;z-index:30;background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:6px;display:none;cursor:pointer;font-size:13px;letter-spacing:.08em;line-height:1.6;box-shadow:0 8px 30px rgba(0,0,0,.25)}#toast.on{display:block;animation:tin .4s ease}@keyframes tin{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.alertbox{border:1px solid var(--line);padding:12px 14px;margin:6px 0 14px;font-size:13px;color:var(--mute)}.alertbox .btn{margin-top:8px}
.readybox{background:var(--accent);color:#fff;padding:12px 14px;margin:0 0 14px;font-size:14px;letter-spacing:.04em;text-align:center}
main,.hero{overflow-x:clip}
@media (max-width:480px){.bar{padding:16px;gap:10px}.logo{font-size:13px;letter-spacing:.2em}nav{gap:12px}nav a{font-size:10.5px;letter-spacing:.08em}}
@media (max-width:350px){.bar{padding:16px 12px}.logo{letter-spacing:.12em}nav{gap:8px}nav a{font-size:10px;letter-spacing:.04em}}
.item h3.pick{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#top">Savore</a>
<nav><a href="#food">Food</a><a href="#matcha">Matcha</a><a href="#berry">Strawberry</a><a href="#coffee">Coffee</a></nav></div></header>
<div class="hero" id="top"><h1>Savore</h1><p>Savor every bite.</p><div class="dot"></div></div>
<div class="marquee"><div class="track" id="track"></div></div>
<main id="menu"></main>
<div id="toast"></div>
<div id="bar"><span id="sum"></span><button class="btn" id="open">View order</button></div>
<div id="sheet"><div id="panel"></div></div>
<footer>SPAGHETTI · POPCORN CHICKEN · MATCHA</footer>

function exBlock(){return '<div class="alertbox"><b>\ud83d\udcf8 Remember: screenshot your payment!</b><br>After you pay, take a screenshot of your payment and send it to us on WhatsApp together with your order. Example of what you will send:<img class="pr" src="'+EX_IMG+'" alt="Example of the WhatsApp order message with payment screenshot"></div>'}
function ctBlock(){
  let h='<p class="note" style="margin:0 0 6px"><b>I am a:</b></p><div class="acts" style="margin:0 0 10px"><button class="btn sm'+(ctype=="Student"?"":" ghost")+'" data-ct="Student">Student</button><button class="btn sm'+(ctype=="Pensyarah"?"":" ghost")+'" data-ct="Pensyarah">Pensyarah</button></div>';
  if(ctype=="Pensyarah"){
    h+='<p class="note" style="margin:0 0 6px"><b>How do you want to get your order?</b></p><div class="acts" style="margin:0 0 10px"><button class="btn sm'+(dmode=="Pick up"?"":" ghost")+'" data-dm="Pick up">Pick up</button><button class="btn sm'+(dmode=="Delivery"?"":" ghost")+'" data-dm="Delivery">Delivery at College area</button></div>';
    if(dmode=="Delivery")h+='<input id="dl" placeholder="Type your location (e.g. block, room, office)" value="'+esc(dloc)+'">';
  }
  return h}
const findOrd=()=>{const n=sNo.trim().replace(/^#/,"");return n?orders.find(r=>String(r.no)==n)||null:null};
function orderCard(r){
  const u=esc(r.uid);
  return '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:12px"><b>#'+esc(r.no)+' · '+esc(r.who)+'</b><span>'+rm(+r.total||0)+'</span></div><div style="margin:4px 0"><b>📞 '+esc(r.phone||"No phone number")+'</b></div>'
   +(r.ctype?'<div class="note">'+esc(r.ctype)+' · '+(r.dmode=="Delivery"?"Delivery at College area: "+esc(r.dloc||""):"Pick up")+'</div>':'')
   +'<div class="note">'+lab(r)+'</div>'
   +(r.lines||[]).map(l=>'<div class="note">'+esc(l[1])+' × '+esc(l[0])+'</div>').join("")
   +(safeImg(r.proof)?'<img class="pr" src="'+safeImg(r.proof)+'" alt="Payment proof">':'')
   +'<div class="acts"><button class="btn ghost sm" data-s="1" data-u="'+u+'">In progress</button><button class="btn ghost sm" data-s="2" data-u="'+u+'">Preparing</button><button class="btn ghost sm" data-s="3" data-u="'+u+'">Ready</button>'
   +(okPhone(r.phone||"")?'<button class="btn sm" data-w="'+u+'">WhatsApp</button>':'')
   +'<button class="btn ghost sm" data-r="'+u+'">Remove</button></div></div>'}
function resHtml(){
  const n=sNo.trim().replace(/^#/,"");if(!n)return"";
  const o=findOrd();
  return o?orderCard(o):'<p class="note">No order #'+esc(n)+' found on this screen. Check the number, or look at the WhatsApp message from the customer.</p>'}
function staffBox(){
  return '<div class="alertbox"><b>Find an order / message a customer</b><input id="sn" placeholder="Order number (e.g. 1234)" value="'+esc(sNo)+'"><div id="sres">'+resHtml()+'</div><input id="sp" inputmode="tel" placeholder="Customer phone number (filled from the order if found)" value="'+esc(sPh)+'"><div class="acts"><button class="btn sm" data-m="ready">Ready to pick up</button><button class="btn sm ghost" data-m="deliver">On the way</button><button class="btn sm ghost" data-m="prep">Preparing</button></div></div>'}
const rm=n=>"RM "+n.toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st=()=>(ord&&ord.status)||1;
const lines=()=>Object.entries(cart).filter(([,v])=>v.q>0);
const total=()=>lines().reduce((s,[,v])=>s+v.p*v.q,0);
const count=()=>lines().reduce((s,[,v])=>s+v.q,0);
const $=id=>document.getElementById(id);
function bar(){const c=count();const on=(c>0||(ord&&ord.status!=4))&&!$("sheet").classList.contains("on");$("bar").classList.toggle("on",!!on);
  $("sum").textContent=c>0?c+(c==1?" item":" items")+" · "+rm(total()):(ord?"Order #"+ord.no:"");
  $("open").textContent=c>0?"View order":"Orders"}
function panel(){
  const L=lines();let o='<button class="x" id="cl" aria-label="Close">×</button>';
  if(view=="sweet"&&pend){$("panel").innerHTML=o+`<h4>Choose sweetness</h4><p style="margin:6px 0 14px">${esc(pend.n)}</p><div class="acts" style="flex-direction:column"><button class="btn ghost" data-sw="Normal sweet">Normal sweet</button><button class="btn ghost" data-sw="Less sweet">Less sweet</button></div>`;return}
  if(view=="cart"){
    o+='<h4>Your order</h4>'+(L.length?L.map(([n,v])=>`<div class="row"><span>${n}</span><span class="step"><button data-d="-1" data-n="${n}">−</button>${v.q}<button data-d="1" data-n="${n}">+</button></span><span>${rm(v.p*v.q)}</span></div>`).join("")+`<div class="tot"><span>Total</span><span>${rm(total())}</span></div><div class="acts"><button class="btn" id="go">Continue to pay</button></div>`:'<p class="note">Your order is empty.</p>');
  }else if(view=="pay"){
    const ok=payOK();
    o+=`<h4>Pay by QR</h4><div class="tot"><span>Amount</span><span>${rm(total())}</span></div><div class="qr"><img src="${PAY_QR}" alt="Touch n Go payment QR"></div><p class="note">Scan with your banking app or Touch n Go eWallet and pay exactly ${rm(total())}.</p><input id="nm" placeholder="Your name" value="${esc(who)}"><input id="ph" inputmode="tel" placeholder="Your phone number (WhatsApp)" value="${esc(phone)}">${ctBlock()}${exBlock()}<div class="acts"><button class="btn ghost" id="bk">Back</button><button class="btn" id="paid" ${ok?"":"disabled"}>I have paid</button></div>`;
  }else if(view=="login"){
    o+=`<h4>Staff<\/h4><p class="note">Enter the staff password.<\/p><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="Password"><p class="note">${esc(smsg)}<\/p><div class="acts"><button class="btn" id="pwgo">Enter<\/button><\/div>`;
  }else if(view=="staff"){
    o+=`<h4>Staff · Orders<\/h4>`+newBanner()+staffBox()+(smsg?`<p class="note">${esc(smsg)}<\/p>`:"")+(orders.length?orders.map(r=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:12px"><b>#${esc(r.no)} · ${esc(r.who)}<\/b><span>${rm(+r.total||0)}<\/span><\/div><div style="margin:4px 0"><b>📞 ${esc(r.phone||"No phone number")}<\/b><\/div><div class="note">${r.ctype?esc(r.ctype)+" · "+(r.dmode=="Delivery"?"Delivery: "+esc(r.dloc||""):"Pick up"):""}<\/div><div class="note">${lab(r)}<\/div>${(r.lines||[]).map(l=>`<div class="note">${esc(l[1])} × ${esc(l[0])}<\/div>`).join("")}${safeImg(r.proof)?`<img class="pr" src="${safeImg(r.proof)}" alt="Payment proof">`:""}<div class="acts"><button class="btn ghost sm" data-s="1" data-u="${esc(r.uid)}">In progress<\/button><button class="btn ghost sm" data-s="2" data-u="${esc(r.uid)}">Preparing<\/button><button class="btn ghost sm" data-s="3" data-u="${esc(r.uid)}">Ready<\/button>${okPhone(r.phone||"")?`<button class="btn sm" data-w="${esc(r.uid)}">WhatsApp<\/button>`:""}<button class="btn ghost sm" data-r="${esc(r.uid)}">Remove<\/button><\/div><\/div>`).join(""):'<p class="note">No orders yet. New customer orders appear here automatically.<\/p>')+`<div class="acts"><button class="btn ghost sm" id="ts">Test sound<\/button><button class="btn ghost sm" id="lo">Log out<\/button><\/div>`;
  }else if(ord){
    const s=st(ord.no);
    o+=s==4?`<h4>Thank you</h4><p style="margin:6px 0 14px">${esc(ord.who)}, your order <b>#${ord.no}</b> has been picked up. Enjoy!</p><div class="acts"><button class="btn" id="nw">New order</button></div>`:`<h4>Thank you</h4><p style="margin:6px 0 14px">${esc(ord.who)}, your order <b>#${ord.no}</b> is placed.</p>${detHtml(ord)}${s==3?'<div class="readybox">\ud83d\udd14 '+(ord.way?"Your order is on the way to you! Slide below once you have received it.":"Your order is ready! "+(ord.dmode=="Delivery"?"It will be delivered to you at "+esc(ord.dloc||"")+".":"Please collect it at the counter."))+'</div>':""}${s<4?`<div class="sl" id="sl"><div class="sk" id="sk">›</div><span>Slide when you have collected your order</span></div>`:""}`+ord.lines.map(([n,q,p])=>`<div class="row"><span>${q} × ${n}</span><span>${rm(p*q)}</span></div>`).join("")+`<div class="tot"><span>Total paid</span><span>${rm(ord.total)}</span></div>${ord.proof?`<p class="note" style="margin:0">Payment proof</p><img class="pr" src="${ord.proof}" alt="Payment proof">`:""}${synced===false?`<p class="note"><b>Your order could not reach the staff screen automatically.<\/b> Please send it to the staff on WhatsApp.<br>Reason: ${esc(synErr)}<\/p>`:""}<p class="note">Tap the WhatsApp button to send your order and payment screenshot to our staff (choose WhatsApp and our chat). Then attach your payment screenshot in the chat. We will message you on WhatsApp when it is ready.</p>${exBlock()}<div class="acts">${SHOP_WA?`<button class="btn" id="wa">Send order on WhatsApp</button>`:""}<button class="btn ghost" id="cp">Copy order</button><button class="btn ghost" id="nw">New order</button></div>`;
  }
  $("panel").innerHTML=o;
}
function show(v){view=v;$("sheet").classList.add("on");panel();bar()}
function hide(){$("sheet").classList.remove("on");bar()}
document.addEventListener("click",async e=>{
  const t=e.target;
  if((t.classList.contains("add")&&t.dataset.c)||t.classList.contains("pick")){pend={n:t.dataset.n,p:+t.dataset.p};return show("sweet")}
  if(t.dataset&&t.dataset.sw&&pend){const n=pend.n+" ("+t.dataset.sw+")";cart[n]=cart[n]||{p:pend.p,q:0};cart[n].q++;pend=null;hide();return}
  if(t.classList.contains("add")){const n=t.dataset.n;cart[n]=cart[n]||{p:+t.dataset.p,q:0};cart[n].q++;bar();t.textContent="Added";setTimeout(()=>t.textContent="Add",900);return}
  if(t.id=="nt"){alertOn=!alertOn;try{localStorage.setItem("savore_alert",alertOn?"1":"0")}catch(_){}if(alertOn){unlockAudio();try{if("Notification" in window&&Notification.permission=="default")await Notification.requestPermission()}catch(_){}ding()}else stopRing();return panel()}
  if(t.id=="open")return show(count()>0?"cart":"done");
  if(t.id=="cl"||t.id=="sheet")return hide();
  if(t.id=="stf"){e.preventDefault();smsg="";if(staffOK){stopRing();watchAll();return show("staff")}return show("login")}
  if(t.id=="pwgo"){const v=($("pw").value||"").trim();if(!auth){smsg="Live orders are not set up yet (Firebase config missing).";return panel()}try{await auth.signInWithEmailAndPassword(STAFF_EMAIL,v);UID=auth.currentUser.uid;staffOK=true;unlockAudio();askNotify();smsg="";watchAll();return show("staff")}catch(e){const c=(e&&e.code)||"error";smsg=(c=="auth/wrong-password"||c=="auth/invalid-credential"||c=="auth/invalid-login-credentials")?"Wrong password.":c=="auth/user-not-found"?"Staff user not found. Add it in Firebase Authentication > Users.":c=="auth/operation-not-allowed"?"Email/Password sign-in is not enabled in Firebase Authentication.":c=="auth/unauthorized-domain"?"This website domain is not authorized. Add it in Firebase Authentication > Settings > Authorized domains.":c=="auth/too-many-requests"?"Too many attempts. Wait a few minutes and try again.":c=="auth/network-request-failed"?"No connection. Check your internet.":"Login failed ("+c+").";return panel()}}
  if(t.id=="ts"){unlockAudio();beep();return}
  if(t.id=="lo"){staffOK=false;smsg="";try{if(auth)await auth.signOut()}catch(_){}unsub=null;orders=[];return hide()}
  if(t.dataset&&t.dataset.s){if(!staffOK||!DB)return;const r=orders.find(x=>x.uid==t.dataset.u);if(!r)return;const s=+t.dataset.s;if(s==3&&okPhone(r.phone||""))wa(waNo(r.phone),"Hi! Your Savore order #"+r.no+" is ready to pick up. Thank you!");try{await DB.doc("orders/"+r.uid).set(Object.assign({},r,{status:s,way:0}));smsg=""}catch(_){smsg="Could not update. Make sure you are signed in as the owner or an invited editor."}return panel()}
  if(t.dataset&&t.dataset.w){const r=orders.find(x=>x.uid==t.dataset.w);if(r)wa(waNo(r.phone||""),"Hi "+(r.who||"")+"! Your Savore order #"+r.no+(r.status==3?" is ready to pick up. Thank you!":" - thank you for your order!"));return}
  if(t.dataset&&t.dataset.r){if(!staffOK||!DB)return;if(!confirm("Remove this order? It will also disappear from the customer's tracking."))return;try{await DB.doc("orders/"+t.dataset.r).delete();smsg=""}catch(_){smsg="Could not remove this order."}return panel()}
  if(t.dataset&&t.dataset.d){cart[t.dataset.n].q+=+t.dataset.d;if(cart[t.dataset.n].q<1)delete cart[t.dataset.n];if(!count())return hide();panel();bar();return}
  if(t.dataset&&t.dataset.ct){const c=t.dataset.ct;if(c!=ctype){ctype=c;dmode=c=="Student"?"Pick up":"";dloc=""}return panel()}
  if(t.dataset&&t.dataset.dm){dmode=t.dataset.dm;if(dmode!="Delivery")dloc="";return panel()}
  if(t.dataset&&t.dataset.m){const fo=findOrd();const ph=okPhone(sPh)?sPh:((fo&&fo.phone)||"");if(!okPhone(ph)){smsg="Type the customer's phone number (or an order number that is found).";return panel()}const n=sNo.trim()?" #"+sNo.trim():"";const M={ready:"Hi! Your Savore order"+n+" is ready to pick up. Thank you!",deliver:"Hi! Your Savore order"+n+" is on the way to you. Thank you!",prep:"Hi! We are preparing your Savore order"+n+". Thank you!"};smsg="";wa(waNo(ph),M[t.dataset.m]);const tg=fo||orders.find(x=>x.phone&&waNo(x.phone)==waNo(ph));if(tg&&tg.status!=4&&staffOK&&DB){const mm=t.dataset.m;try{await DB.doc("orders/"+tg.uid).set(Object.assign({},tg,{status:mm=="prep"?2:3,way:mm=="deliver"?1:0}))}catch(_){smsg="WhatsApp opened, but the customer status could not be updated."}}return panel()}
  if(t.id=="go")return show("pay");
  if(t.id=="bk")return show("cart");
  if(t.id=="paid"){ord={no:String(Math.floor(1000+Math.random()*9000)),status:1,who:who.trim(),phone:phone.trim(),ctype:ctype,dmode:dmode,dloc:dloc.trim(),proof:proof,lines:lines().map(([n,v])=>[n,v.q,v.p]),total:total()};try{localStorage.setItem("savore_order",JSON.stringify(ord))}catch(_){}for(const k in cart)delete cart[k];proof="";pmsg="";synced=null;submit(ord);return show("done")}
  if(t.id=="wa"){const txt="Savore order #"+ord.no+"\nName: "+ord.who+"\nPhone: "+ord.phone+detail(ord)+"\n"+ord.lines.map(([n,q])=>q+" x "+n).join("\n")+"\nTotal paid: "+rm(ord.total)+"";
    try{const pr=safeImg(ord.proof);if(pr&&navigator.share&&navigator.canShare){const bin=atob(pr.split(",")[1]),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const f=new File([u8],"payment-proof-"+ord.no+".jpg",{type:"image/jpeg"});if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:txt});return}catch(err){if(err&&err.name=="AbortError")return}}}}catch(_){}
    wa(SHOP_WA,txt);return}
  if(t.id=="rf")return location.reload();
  if(t.id=="cp"){const s="Savore order #"+ord.no+" ("+ord.who+")"+detail(ord)+"\n"+ord.lines.map(([n,q])=>q+" x "+n).join("\n")+"\nTotal "+rm(ord.total);try{await navigator.clipboard.writeText(s);t.textContent="Copied"}catch(_){t.textContent="Copy not available"}return}
  if(t.id=="nw"){ord=null;who="";phone="";proof="";pmsg="";ctype="";dmode="";dloc="";try{localStorage.removeItem("savore_order")}catch(_){}hide()}
});
document.addEventListener("input",e=>{const i=e.target.id;if(i=="nm"||i=="ph"||i=="dl"){if(i=="nm")who=e.target.value;else if(i=="ph")phone=e.target.value;else dloc=e.target.value;const b=$("paid");if(b)b.disabled=!payOK()}else if(i=="sp")sPh=e.target.value;else if(i=="sn"){sNo=e.target.value;const r=$("sres");if(r)r.innerHTML=resHtml()}});
document.addEventListener("change",async e=>{if(e.target.id!="pf")return;const f=e.target.files[0];pmsg="";proof="";if(!f||!f.type.startsWith("image/"))pmsg="Please upload a screenshot image.";else{proof=await thumb(f);if(!proof)pmsg="That file could not be read. Please upload a screenshot image."}panel()});
let drag=null;
document.addEventListener("pointerdown",e=>{const k=e.target.closest&&e.target.closest("#sk");if(!k)return;drag={x:e.clientX,max:$("sl").clientWidth-46,d:0};k.style.transition="none";if(k.setPointerCapture)k.setPointerCapture(e.pointerId)});
document.addEventListener("pointermove",e=>{if(!drag||!$("sk"))return;drag.d=Math.max(0,Math.min(drag.max,e.clientX-drag.x));$("sk").style.transform="translateX("+drag.d+"px)"});
document.addEventListener("pointerup",async()=>{if(!drag)return;const ok=drag.d>=drag.max*.9;drag=null;const k=$("sk");if(!ok){if(k){k.style.transition="transform .25s";k.style.transform="none"}return}if(!ord)return;ord.status=4;try{localStorage.setItem("savore_order",JSON.stringify(ord))}catch(_){}bar();panel();if(DB&&UID){try{const w=Object.assign({},ord,{uid:UID,ts:Date.now()});delete w.way;await DB.doc("orders/"+UID).set(w)}catch(_){}}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="pw")$("pwgo").click()});
bar();
</script>
</body>
